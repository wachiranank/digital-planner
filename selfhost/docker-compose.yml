# Digital Product Store + Digital Planner — self-hosted on one VPS.
# Everything is configured in .env (created by ./install.sh). Do not edit secrets here.
name: digital-suite

x-restart: &restart
  restart: unless-stopped

services:
  # ---------- database (Postgres with Supabase roles/extensions) ----------
  db:
    <<: *restart
    image: supabase/postgres:17.6.1.136
    volumes:
      - ./db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- login (Supabase Auth / GoTrue) — Google sign-in for the planner ----------
  auth:
    <<: *restart
    image: supabase/gotrue:v2.197.0
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://${API_DOMAIN}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: https://${PLANNER_DOMAIN}
      GOTRUE_URI_ALLOW_LIST: https://${PLANNER_DOMAIN}/auth/callback,https://${PLANNER_DOMAIN}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: https://${API_DOMAIN}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: https://${API_DOMAIN}/auth/v1/callback
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- database API (PostgREST) ----------
  rest:
    <<: *restart
    image: postgrest/postgrest:v14.18
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  # ---------- applies SQL migrations once (re-run on every update) ----------
  migrate:
    image: supabase/postgres:17.6.1.136
    depends_on:
      db: { condition: service_healthy }
      auth: { condition: service_healthy } # auth creates auth.users first
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"

  # ---------- the two apps ----------
  store:
    <<: *restart
    image: ${STORE_IMAGE:-ghcr.io/wachiranank/digital-product-store:latest}
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      SITE_URL: https://${STORE_DOMAIN}
      SUPABASE_URL: https://${API_DOMAIN}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      PLANNER_URL: https://${PLANNER_DOMAIN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${STORE_LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_OWNER_USER_ID: ${STORE_LINE_OWNER_USER_ID:-}

  planner:
    <<: *restart
    image: ${PLANNER_IMAGE:-ghcr.io/wachiranank/digital-planner:latest}
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      APP_URL: https://${PLANNER_DOMAIN}
      SUPABASE_URL: https://${API_DOMAIN}
      SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      SUPABASE_SECRET_KEY: ${SERVICE_ROLE_KEY}
      STORE_URL: http://store:3000 # License API over the internal network
      PUBLIC_STORE_URL: https://${STORE_DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: mailto:${ADMIN_EMAIL}
      CRON_SECRET: ${CRON_SECRET}
      LINE_CHANNEL_SECRET: ${PLANNER_LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${PLANNER_LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_BOT_BASIC_ID: ${PLANNER_LINE_BOT_BASIC_ID:-}

  # ---------- reminders every 5 minutes ----------
  cron:
    <<: *restart
    image: alpine:3.20
    depends_on: [planner]
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command:
      - sh
      - -c
      - |
        echo "*/5 * * * * wget -qO- --header=\"Authorization: Bearer $$CRON_SECRET\" http://planner:3000/api/cron/reminders >/proc/1/fd/1 2>&1" > /etc/crontabs/root
        exec crond -f -l 8

  # ---------- HTTPS (automatic Let's Encrypt certificates) ----------
  caddy:
    <<: *restart
    image: caddy:2-alpine
    depends_on: [store, planner, auth, rest]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      PLANNER_DOMAIN: ${PLANNER_DOMAIN}
      STORE_DOMAIN: ${STORE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro # extra sites for other apps on this VPS (see sites/README.md)
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        # containers reach the public names through Caddy directly (no DNS/hairpin needed inside the VPS)
        aliases: ["${API_DOMAIN}", "${PLANNER_DOMAIN}", "${STORE_DOMAIN}"]
      edge:

networks:
  default:
  # shared network so this Caddy can also front other apps on the same VPS
  edge:
    name: edge
    external: true

volumes:
  db-data:
  db-config:
  caddy-data:
  caddy-config:
